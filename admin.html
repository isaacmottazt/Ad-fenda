<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Painel Admin - Fenda Music</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      padding: 20px;
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Cabeçalho */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .admin-header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #fff, #c084fc);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .logout-admin {
      background: rgba(255,74,117,0.1);
      border: 1px solid rgba(255,74,117,0.3);
      border-radius: 40px;
      padding: 8px 20px;
      color: #ff4a75;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .logout-admin:hover {
      background: rgba(255,74,117,0.2);
    }

    /* Abas */
    .admin-tabs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 8px;
    }

    .admin-tab {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }

    .admin-tab.active {
      background: rgba(146,76,255,0.2);
      color: #b07fff;
    }

    .tab-pane {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-pane.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards e formulários */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .admin-card {
      background: rgba(20,18,30,0.7);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid rgba(146,76,255,0.2);
      transition: 0.2s;
    }

    .admin-card:hover {
      border-color: #b07fff;
      background: rgba(30,26,45,0.9);
    }

    .admin-card h3 {
      font-size: 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-card p {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
      word-break: break-word;
    }

    .btn-icon {
      background: rgba(255,255,255,0.05);
      border: none;
      border-radius: 30px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon.danger { color: #ff4a75; }
    .btn-icon:hover { background: rgba(146,76,255,0.3); }

    .form-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }

    .form-modal.active {
      visibility: visible;
      opacity: 1;
    }

    .form-modal-content {
      background: linear-gradient(145deg, #1a1625, #120e1c);
      border-radius: 32px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid rgba(146,76,255,0.3);
    }

    .form-modal-content h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: rgba(255,255,255,0.7);
    }

    .form-group input, 
    .form-group textarea, 
    .form-group select {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(146,76,255,0.3);
      border-radius: 16px;
      padding: 12px 14px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .form-group select option {
      background: #1a1625;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #924cff, #6a2ad4);
      border: none;
      border-radius: 40px;
      padding: 10px 20px;
      font-weight: 600;
      color: white;
      cursor: pointer;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 40px;
      padding: 10px 20px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1c1826;
      border-radius: 40px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1100;
      animation: slideUp 0.3s ease;
      border-left: 4px solid #4caf50;
    }

    @keyframes slideUp {
      from { bottom: -50px; opacity: 0; }
      to { bottom: 30px; opacity: 1; }
    }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: rgba(255,255,255,0.4);
    }

    @media (max-width: 700px) {
      .card-grid { grid-template-columns: 1fr; }
      .admin-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
<div class="admin-container">
  <div class="admin-header">
    <h1>🛠️ Painel Administrativo</h1>
    <button id="adminLogoutBtn" class="logout-admin">Sair do admin</button>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="users">👥 Usuários</button>
    <button class="admin-tab" data-tab="musics">🎵 Músicas</button>
    <button class="admin-tab" data-tab="artists">🎤 Artistas</button>
    <button class="admin-tab" data-tab="podcasts">🎙️ Podcasts</button>
  </div>

  <!-- Aba Usuários -->
  <div id="usersTab" class="tab-pane active">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Usuários cadastrados</h2>
      <span id="usersCount" style="background:rgba(146,76,255,0.2); padding:4px 12px; border-radius:40px;">0</span>
    </div>
    <div id="usersList" class="card-grid"></div>
  </div>

  <!-- Aba Músicas -->
  <div id="musicsTab" class="tab-pane">
    <div style="margin-bottom: 20px;">
      <button id="newMusicBtn" class="btn-primary">+ Nova música</button>
    </div>
    <div id="musicsList" class="card-grid"></div>
  </div>

  <!-- Aba Artistas -->
  <div id="artistsTab" class="tab-pane">
    <div style="margin-bottom: 20px;">
      <button id="newArtistBtn" class="btn-primary">+ Novo artista</button>
    </div>
    <div id="artistsList" class="card-grid"></div>
  </div>

  <!-- Aba Podcasts -->
  <div id="podcastsTab" class="tab-pane">
    <div style="margin-bottom: 20px;">
      <button id="newPodcastBtn" class="btn-primary">+ Novo podcast</button>
    </div>
    <div id="podcastsList" class="card-grid"></div>
  </div>
</div>

<!-- Modal genérico (o conteúdo é preenchido dinamicamente pelo admin.js) -->
<div id="genericModal" class="form-modal">
  <div class="form-modal-content">
    <h2 id="modalTitle">Título</h2>
    <div id="modalBody"></div>
    <div class="form-actions">
      <button id="modalCancelBtn" class="btn-secondary">Cancelar</button>
      <button id="modalConfirmBtn" class="btn-primary">Salvar</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
